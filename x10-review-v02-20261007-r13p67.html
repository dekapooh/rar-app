.name{min-width:0}.hname{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}

.detail{grid-column:1/-1;display:none;background:#f7f9fc;border-radius:10px;padding:8px;margin-top:3px}.row.open .detail{display:block}.signals{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.sig{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}.sig b{display:block;font-size:13px}.sig span{font-size:8px;color:var(--muted)}.warn{margin-top:6px;font-size:9px;color:var(--red);font-weight:800}

@media(max-width:390px){.legend,.row{grid-template-columns:34px 1fr 50px 48px 54px}.controls{grid-template-columns:1fr auto}.controls select{grid-column:1/-1}.signals{grid-template-columns:repeat(4,1fr)}}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function deltaHtml(d){if(d>0)return '<span class="delta up">↑'+d+'</span>';if(d<0)return '<span class="delta down">↓'+Math.abs(d)+'</span>';return '<span class="delta same">±0</span>'}
function render(){

}
