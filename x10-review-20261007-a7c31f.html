   <div class="name"><div class="hname">${esc(r.name)}</div><div class="meta">No.${r.no}｜${esc(r.recruitmentName)}｜${esc(r.sex)}</div></div>
   <div class="num official">#${r.officialRank}<div class="meta">${r.officialScore.toFixed(2)}</div></div>
   <div class="num">${deltaHtml(r.delta)}</div>
   <div class="num x10">${r.x10Score.toFixed(2)}</div>
   <div class="detail">
     <div class="signals">
       <div class="sig"><b>${r.SC2}</b><span>SC2 /3</span></div>
       <div class="sig"><b>${r.T3G}</b><span>T3-G /3</span></div>
       <div class="sig"><b>${r.T1}</b><span>T1 /3</span></div>
       <div class="sig"><b>${r.NICKS}</b><span>NICKS /10</span></div>
       <div class="sig"><b>${r.ScaleFrame}</b><span>ScaleFrame /6</span></div>
       <div class="sig"><b>${r.R2G}</b><span>R2-G /3</span></div>
       <div class="sig"><b>${r.F2G}</b><span>F2-G /3</span></div>
       <div class="sig"><b>${r.R4}</b><span>R4 /2</span></div>
     </div>
     ${r.penalty?'<div class="warn">警戒条件：SC2 ≤ 1 ＋ R4 = 2</div>':''}
   </div>
 </div>`).join('') || '<div style="padding:25px;text-align:center;color:#6b778c">該当なし</div>';
 [...document.querySelectorAll('.row')].forEach(el=>el.onclick=()=>el.classList.toggle('open'));
}
q.oninput=render;sort.onchange=render;topBtn.onclick=()=>{topOnly=!topOnly;topBtn.textContent=topOnly?'全96頭':'TOP10のみ';render()};render();
</script>
</body>
</html>
