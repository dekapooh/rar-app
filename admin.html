<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7f1d1d">
<title>RAR Admin</title>
<style>
body{margin:0;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
main{max-width:520px;margin:auto;padding:40px 18px;text-align:center}
b{display:block;font-size:20px}.note{margin-top:10px;font-size:12px;color:#667085;line-height:1.7}
</style>
</head>
<body>
<main><b>RAR Admin</b><div class="note">管理者画面を読み込んでいます…</div></main>
<script>
(async()=>{
 if(!("serviceWorker" in navigator))return;
 try{
   const reg=await navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"});
   await reg.update().catch(()=>{});
   if(!navigator.serviceWorker.controller){
     navigator.serviceWorker.addEventListener("controllerchange",()=>location.reload(),{once:true});
   }else{
     location.reload();
   }
 }catch(e){console.error(e);}
})();
</script>
</body>
</html>
