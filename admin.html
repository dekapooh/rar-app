<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7f1d1d">
<link rel="manifest" href="./admin.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>RAR Admin Installer</title>
<style>
body{margin:0;background:#f4f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#172033}
main{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding:28px 18px;box-sizing:border-box}
.badge{display:inline-block;background:#7f1d1d;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
h1{font-size:24px;margin:14px 0 8px}.note{font-size:13px;line-height:1.7;color:#5f6b7a}
.card{margin-top:18px;border:1px solid #dbe4ee;border-radius:16px;padding:16px;background:#fff}
a.btn{display:block;margin-top:14px;background:#0f2f57;color:#fff;text-decoration:none;text-align:center;border-radius:12px;padding:13px;font-weight:800}
code{word-break:break-all;font-size:11px}
</style>
</head>
<body>
<main>
  <span class="badge">ADMIN / INTERNAL</span>
  <h1>RAR Admin</h1>
  <div class="note">管理者・内部確認専用のホーム画面アイコンを作成するためのページです。</div>
  <div class="card">
    <b>Android / Chrome</b>
    <div class="note" style="margin-top:8px">
      Chromeメニューから「ホーム画面に追加」または「アプリをインストール」を実行してください。<br>
      作成された <b>RAR Admin</b> アイコンから起動すると、管理者モードで直接開きます。
    </div>
    <a class="btn" href="./index.html?rar_admin=1">管理者画面を今すぐ開く</a>
  </div>
</main>
</body>
</html>
