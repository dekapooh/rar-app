<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAR Manager</title><style>body{font-family:system-ui;background:#101214;color:#f5f5f5;margin:0;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:#1b1e21;border:1px solid #333;border-radius:16px;padding:18px;margin:14px 0}button{padding:12px 16px;border:0;border-radius:12px}.primary{background:#ff8a00;color:#111;font-weight:700}.danger{background:#7a2020;color:#fff}.hidden{display:none}.row{display:flex;gap:10px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #333;text-align:left}</style></head><body><main class="wrap"><h1>RAR Manager</h1><p>管理・設定する人｜OWNER only</p><section id="signin" class="card"><button id="login" class="primary">Googleでログイン</button></section><section id="noowner" class="card hidden"><h2>OWNER権限なし</h2><code id="uid"></code><br><button id="logout1">ログアウト</button></section><section id="manager" class="hidden"><div class="card row"><strong id="owner"></strong><span>OWNER認証済み</span><button id="logout2">ログアウト</button></div><div class="card"><h2>Builder協力者申請</h2><div id="apps">読み込み中…</div></div></section><section id="err" class="card hidden"><pre id="errmsg"></pre></section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,doc,getDoc,getDocs,getFirestore,query,writeBatch,where}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
const cfg={apiKey:'AIzaSyDrhbYjwxvTCN-I-Kos-SpSLJS9En3btDE',authDomain:'rar-project-5a27e.firebaseapp.com',projectId:'rar-project-5a27e',storageBucket:'rar-project-5a27e.firebasestorage.app',messagingSenderId:'574526681741',appId:'1:574526681741:web:a5da958e5babc1c16c68c4'},auth=getAuth(initializeApp(cfg)),db=getFirestore(),$=x=>document.getElementById(x);function show(id){for(const x of['signin','noowner','manager'])$(x).classList.add('hidden');$(id).classList.remove('hidden');$('err').classList.add('hidden')}function fail(e){$('errmsg').textContent=e?.message||e;$('err').classList.remove('hidden')}const now=()=>new Date().toISOString();async function owner(uid){const s=await getDoc(doc(db,'adminUsers',uid));return s.exists()&&s.data()?.status==='ACTIVE'}async function decide(uid,ok,premium=false){const me=auth.currentUser,t=now(),b=writeBatch(db);b.set(doc(db,'builderApplications',uid),{rar_user_id:uid,status:ok?'APPROVED':'REJECTED',reviewed_by:me.uid,reviewed_at:t,updated_at:t},{merge:true});b.set(doc(db,'builderAuthorizations',uid),{rar_user_id:uid,status:ok?'APPROVED':'REVOKED',role:'CONTRIBUTOR',assigned_clubs:[],approved_by:me.uid,approved_at:t,updated_at:t},{merge:true});if(ok&&premium)b.set(doc(db,'benefitEntitlements',uid,'items','builder-contributor-premium'),{entitlement_id:'builder-contributor-premium',rar_user_id:uid,benefit_plan:'PREMIUM',benefit_reason:'BUILDER_CONTRIBUTOR',status:'ACTIVE',starts_at:t,ends_at:null,granted_by:me.uid,granted_at:t,updated_at:t},{merge:true});await b.commit();load()}async function load(){const s=await getDocs(query(collection(db,'builderApplications'),where('status','==','PENDING')));if(s.empty){$('apps').innerHTML='<p>現在、承認待ちの申請はありません。</p>';return}const tb=document.createElement('table');tb.innerHTML='<tr><th>申請者</th><th>操作</th></tr>';for(const d of s.docs){const r=tb.insertRow(),a=r.insertCell(),c=r.insertCell();a.textContent=d.data().display_ref||d.id;for(const[x,fn,cl]of[['承認＋Premium',()=>decide(d.id,true,true),'primary'],['承認のみ',()=>decide(d.id,true),''],['却下',()=>decide(d.id,false),'danger']]){const z=document.createElement('button');z.textContent=x;z.className=cl;z.onclick=()=>fn().catch(fail);c.append(z)}}$('apps').replaceChildren(tb)}$('login').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);$('logout1').onclick=$('logout2').onclick=()=>signOut(auth).catch(fail);onAuthStateChanged(auth,async u=>{try{if(!u)return show('signin');if(!await owner(u.uid)){$('uid').textContent=u.uid;return show('noowner')}$('owner').textContent=u.displayName||'RAR Owner';show('manager');await load()}catch(e){fail(e)}});
</script></body></html>
