name: RAR Silk 2025 Server E2E Driver

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-silk2025-server-e2e-driver.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Firebase Admin credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-firebase-service-account.json

      - name: Install driver dependencies
        run: python -m pip install --disable-pip-version-check --quiet firebase-admin google-cloud-firestore requests

      - name: Drive Silk 2025 from persisted state to RAR transfer
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/rar-firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: rar-project-5a27e
        run: |
          python - <<'PY'
          import json
          import sys
          import time
          from urllib.parse import quote

          import firebase_admin
          from firebase_admin import auth, credentials, firestore
          import requests

          PROJECT="rar-project-5a27e"
          DATASET="2025:silk"
          BASE="https://rar-project-5a27e.web.app"
          API_KEY="AIzaSyDrhbYjwxvTCN-I-Kos-SpSLJS9En3btDE"
          ACTIVE={
              "READY_FOR_OWNER","OWNER_CLAIMED","PREPROCESSING","ANALYSIS_RUNNING",
              "ANALYSIS_PARTIAL","ANALYSIS_COMPLETE","CROSSCHECK_PENDING",
              "MANAGER_QA_PENDING","QA_PASS","TRANSFER_READY",
          }

          cred=credentials.Certificate("/tmp/rar-firebase-service-account.json")
          firebase_admin.initialize_app(cred, {"projectId": PROJECT})
          db=firestore.client()

          subs=[]
          for snap in db.collection("builderSubmissions").where("dataset_key","==",DATASET).stream():
              d=snap.to_dict() or {}
              if str(d.get("source_mode") or "")!="OFFICIAL_URL_IMPORT":
                  continue
              if str(d.get("status") or "") not in ACTIVE:
                  continue
              if d.get("pdf_deleted_at"):
                  continue
              ts=str(d.get("created_at") or d.get("submitted_at") or d.get("updated_at") or "")
              subs.append((ts,snap.id,d))
          if not subs:
              raise SystemExit("No active official 2025:silk submission")
          subs.sort()
          _,sid,sub=subs[-1]

          owner_uid=str(sub.get("claimed_by") or "").strip()
          if not owner_uid:
              raise SystemExit("Latest submission is not claimed by Owner")
          catalog_sha=str((sub.get("catalog") or {}).get("sha256") or "").lower()
          if len(catalog_sha)!=64:
              raise SystemExit("Catalog SHA invalid")

          print("TARGET_SUBMISSION="+sid)
          print("TARGET_STATUS="+str(sub.get("status") or ""))
          print("TARGET_DATASET="+str(sub.get("dataset_key") or ""))

          custom=auth.create_custom_token(owner_uid).decode("utf-8")
          ex=requests.post(
              "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken",
              params={"key":API_KEY},
              json={"token":custom,"returnSecureToken":True},
              timeout=30,
          )
          if ex.status_code!=200:
              raise SystemExit("Firebase custom-token exchange failed HTTP "+str(ex.status_code))
          id_token=ex.json().get("idToken")
          if not id_token:
              raise SystemExit("Firebase ID token missing")

          s=requests.Session()
          s.headers.update({"Authorization":"Bearer "+id_token})

          def json_response(resp,label):
              text=resp.text
              try:
                  data=resp.json() if text else {}
              except Exception:
                  raise RuntimeError(f"{label}: HTTP {resp.status_code} non-JSON response")
              if not resp.ok:
                  detail=data.get("detail") or data.get("message") or data
                  raise RuntimeError(f"{label}: HTTP {resp.status_code}: {detail}")
              return data

          cap=json_response(s.get(BASE+"/v1/runtime/capabilities",timeout=30),"capabilities")
          print("AUTHENTICATED_RUNTIME="+str(cap.get("runtime_version") or "PASS"))

          def progress():
              url=BASE+"/v1/potential/batch/progress-by-catalog/"+catalog_sha
              return json_response(s.get(url,params={"submission_id":sid},timeout=60),"progress")

          def start_batch(start,end):
              files={
                  "batch_start":(None,str(start)),
                  "batch_end":(None,str(end)),
                  "submission_id":(None,sid),
              }
              resp=s.post(BASE+"/v1/potential/batch/start",files=files,stream=True,timeout=(30,300))
              if not resp.ok:
                  return None, f"HTTP_{resp.status_code}"
              ready=None
              for raw in resp.iter_lines(decode_unicode=True):
                  if not raw:
                      continue
                  ev=json.loads(raw)
                  et=ev.get("event")
                  if et in {"batch_error","batch_review"}:
                      return None, str(ev.get("issue_code") or ev.get("issue_codes") or et)
                  if et=="batch_ready":
                      ready=ev
              return ready, None

          run_id=str(sub.get("run_id") or "")
          guard=0
          while True:
              p=progress()
              processed=int(p.get("processed") or 0)
              total=int(p.get("total") or 0)
              print(f"PROGRESS={processed}/{total}")
              if p.get("status")=="COMPLETE":
                  run_id=str(p.get("run_id") or run_id)
                  break
              if total!=82:
                  raise RuntimeError("Unexpected horse count "+str(total))
              start=int(p.get("next_batch_start") or 0)
              end=int(p.get("next_batch_end") or min(start+9,82))
              if start<1:
                  raise RuntimeError("Missing next batch start")
              guard+=1
              if guard>20:
                  raise RuntimeError("Batch guard exceeded")

              batch_done=False
              for batch_attempt in range(1,5):
                  print(f"BATCH_START={start}-{end}|ATTEMPT={batch_attempt}")
                  ready,err=start_batch(start,end)
                  if not ready:
                      print("BATCH_PREP_RETRY="+str(err))
                      time.sleep(min(5*batch_attempt,15))
                      continue
                  run_id=str(ready.get("run_id") or run_id)
                  pending=[int(x) for x in (ready.get("pending") or [])]
                  if not pending:
                      batch_done=True
                      break

                  restart=False
                  for no in pending:
                      horse_ok=False
                      for attempt in range(1,4):
                          try:
                              resp=s.post(
                                  BASE+"/v1/potential/batch/"+quote(str(ready["job_id"]),safe="")+"/horse/"+str(no),
                                  json={},
                                  timeout=(30,240),
                              )
                              h=json_response(resp,f"horse {no}")
                          except Exception as exc:
                              print(f"HORSE_RETRY={no}|ATTEMPT={attempt}|TRANSPORT={type(exc).__name__}")
                              if attempt<3:
                                  time.sleep(5*attempt)
                                  continue
                              restart=True
                              break

                          if h.get("status")=="PASS":
                              print(f"HORSE_PASS={no}|OVERALL={h.get('overall_processed','?')}/82")
                              horse_ok=True
                              break
                          issue=str(h.get("issue_code") or h.get("status") or "UNKNOWN")
                          print(f"HORSE_RETRY={no}|ATTEMPT={attempt}|ISSUE={issue}")
                          if issue=="BATCH_SESSION_EXPIRED_OR_NOT_FOUND":
                              restart=True
                              break
                          if issue=="HEAVY_EXECUTION_FAILED" and attempt<3:
                              time.sleep(5*attempt)
                              continue
                          raise RuntimeError(f"No.{no} Potential stopped: {issue}")

                      if restart:
                          break
                      if not horse_ok:
                          raise RuntimeError(f"No.{no} Potential did not pass")

                  if restart:
                      print("BATCH_RESTART_FROM_PERSISTED_PROGRESS=YES")
                      time.sleep(3)
                      continue
                  batch_done=True
                  break

              if not batch_done:
                  raise RuntimeError(f"Batch {start}-{end} failed after retries")

          if not run_id:
              raise RuntimeError("Potential run_id missing after completion")
          print("POTENTIAL_COMPLETE=82/82")

          cross=json_response(
              s.post(BASE+"/v1/potential/batch/crosscheck-v2/"+quote(run_id,safe=""),json={},timeout=180),
              "crosscheck",
          )
          if cross.get("status")!="PASS" or int(cross.get("checked") or 0)!=82:
              raise RuntimeError("Crosscheck failed: "+json.dumps(cross,ensure_ascii=False))
          print("CROSSCHECK=PASS")

          final_files={
              "submission_id":(None,sid),
              "run_id":(None,run_id),
          }
          final=json_response(
              s.post(BASE+"/v1/final-score/build",files=final_files,timeout=(30,900)),
              "final-score",
          )
          if final.get("status")!="FROZEN_FINAL" or int(final.get("record_count") or 0)!=82:
              raise RuntimeError("Final scoring did not reach FROZEN_FINAL")
          payload=final.get("payload")
          if not isinstance(payload,dict) or len(payload.get("records") or [])!=82:
              raise RuntimeError("Final payload invalid")
          print("FINAL_SCORE=FROZEN_FINAL_82")

          dry=json_response(
              s.post(BASE+"/v1/consumer-transfer/frozen-v2/validate",json=payload,timeout=180),
              "transfer-validate",
          )
          if dry.get("status")!="PASS_DRY_RUN" or int(dry.get("record_count") or 0)!=82:
              raise RuntimeError("Transfer dry-run failed")
          print("TRANSFER_DRY_RUN=PASS")

          commit=json_response(
              s.post(
                  BASE+"/v1/consumer-transfer/frozen-v2/commit",
                  json={"payload":payload,"dry_run":dry},
                  timeout=240,
              ),
              "transfer-commit",
          )
          if commit.get("status")!="PASS_TRANSFER" or not commit.get("version_id"):
              raise RuntimeError("Transfer commit failed")
          print("TRANSFER_COMMIT=PASS")

          current=json_response(
              s.get(BASE+"/v1/consumer-data/dataset/"+quote(DATASET,safe=""),timeout=120),
              "consumer-adoption",
          )
          if (
              str(current.get("dataset_key") or "")!=DATASET
              or int(current.get("record_count") or 0)!=82
              or str(current.get("version_id") or "")!=str(commit.get("version_id") or "")
              or str(current.get("source_submission_id") or "")!=sid
          ):
              raise RuntimeError("Consumer adoption verification failed")
          print("CONSUMER_ADOPTION=PASS_82")

          done=json_response(
              s.post(
                  BASE+"/v1/submissions/"+quote(sid,safe="")+"/complete-transfer",
                  json={
                      "version_id":commit.get("version_id"),
                      "payload_sha256":commit.get("payload_sha256"),
                      "consumer_records_sha256":commit.get("consumer_records_sha256"),
                  },
                  timeout=180,
              ),
              "complete-transfer",
          )
          if done.get("status")!="RAR_TRANSFERRED" or done.get("pdf_deleted") is not True:
              raise RuntimeError("R2 cleanup confirmation failed")
          print("R2_PDF_DELETE=PASS")
          print("RESULT=PASS_SILK_2025_SERVER_E2E")
          PY
