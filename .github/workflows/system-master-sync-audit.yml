name: SYSTEM MASTER sync audit

on:
  push:
    branches:
      - fix/system-master-sync-20260917
    paths:
      - "sw.js"
      - "system-master-sync.js"
      - ".github/workflows/system-master-sync-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check sw.js
          node --check system-master-sync.js
      - name: Wiring assertions
        run: |
          grep -Fq 'system-master-sync.js' sw.js
          grep -Fq 'v12-system-master' sw.js
          grep -Fq 'rar-project-5a27e.web.app/v1/consumer-data/current' system-master-sync.js
          grep -Fq "EXPECTED_COUNT = 82" system-master-sync.js
          grep -Fq "EXPECTED_RELEASE = 'FROZEN_100_20260914'" system-master-sync.js
          grep -Fq 'transferred_at' system-master-sync.js
          grep -Fq '最終更新' system-master-sync.js
          echo SYSTEM_MASTER_SYNC_STATIC_QA=PASS
