name: RAR GCP Service Account Path Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-gcp-service-account-path-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/setup-gcloud@v2
      - name: Authenticate Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-gcp.json
          gcloud auth activate-service-account --key-file=/tmp/rar-gcp.json --quiet
          gcloud config set project rar-project-5a27e --quiet

      - name: Probe candidate service-account impersonation
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, urllib.request, urllib.error

          candidates=[
            "rar-github-deploy@rar-project-5a27e.iam.gserviceaccount.com",
            "rar-builder-runtime@rar-project-5a27e.iam.gserviceaccount.com",
            "574526681741@cloudbuild.gserviceaccount.com",
            "574526681741-compute@developer.gserviceaccount.com",
            "service-574526681741@gcp-sa-cloudbuild.iam.gserviceaccount.com",
          ]
          project_perms=[
            "cloudbuild.builds.create","cloudbuild.builds.get",
            "artifactregistry.repositories.downloadArtifacts",
            "artifactregistry.repositories.uploadArtifacts",
          ]
          run_perms=["run.services.get","run.services.update"]

          def test(token,url,perms):
            req=urllib.request.Request(
              url,data=json.dumps({"permissions":perms}).encode(),
              headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"},method="POST")
            try:
              with urllib.request.urlopen(req,timeout=20) as r:
                return set(json.load(r).get("permissions",[]))
            except Exception:
              return set()

          for sa in candidates:
            print("CANDIDATE="+sa)
            p=subprocess.run(
              ["gcloud","auth","print-access-token","--impersonate-service-account="+sa],
              text=True,capture_output=True)
            if p.returncode!=0 or not p.stdout.strip():
              msg=(p.stderr or "").replace("\n"," ")[:300]
              print("IMPERSONATE=NO|DETAIL="+msg)
              continue
            print("IMPERSONATE=YES")
            token=p.stdout.strip()
            gotp=test(token,
              "https://cloudresourcemanager.googleapis.com/v1/projects/rar-project-5a27e:testIamPermissions",
              project_perms)
            gotr=test(token,
              "https://run.googleapis.com/v1/projects/rar-project-5a27e/locations/asia-northeast1/services/rar-builder-runtime:testIamPermissions",
              run_perms)
            for perm in project_perms+run_perms:
              print("PERM_"+perm+"="+("YES" if perm in (gotp|gotr) else "NO"))
          print("RESULT=PASS_SERVICE_ACCOUNT_PATH_DIAGNOSTIC")
          PY
