name: RAR Deploy Permission Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-deploy-permission-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/setup-gcloud@v2
      - name: Authenticate base credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-gcp.json
          gcloud auth activate-service-account --key-file=/tmp/rar-gcp.json --quiet
          gcloud config set project rar-project-5a27e --quiet

      - name: Inspect impersonated deploy path
        run: |
          set -euo pipefail
          DEPLOY_SA="rar-github-deploy@rar-project-5a27e.iam.gserviceaccount.com"
          TOKEN="$(gcloud auth print-access-token --impersonate-service-account="$DEPLOY_SA")"
          export TOKEN
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ["TOKEN"]
          checks={
            "PROJECT":(
              "https://cloudresourcemanager.googleapis.com/v1/projects/rar-project-5a27e:testIamPermissions",
              [
                "cloudbuild.builds.create","cloudbuild.builds.get",
                "cloudbuild.triggers.get","cloudbuild.triggers.list","cloudbuild.triggers.run",
                "artifactregistry.repositories.downloadArtifacts",
                "artifactregistry.repositories.uploadArtifacts",
                "iam.serviceAccounts.actAs"
              ]
            ),
            "RUN":(
              "https://run.googleapis.com/v1/projects/rar-project-5a27e/locations/asia-northeast1/services/rar-builder-runtime:testIamPermissions",
              ["run.services.get","run.services.update"]
            )
          }
          for label,(url,perms) in checks.items():
            req=urllib.request.Request(
              url,
              data=json.dumps({"permissions":perms}).encode(),
              headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"},
              method="POST",
            )
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                got=set(json.load(r).get("permissions",[]))
            except urllib.error.HTTPError as exc:
              print(label+"_HTTP="+str(exc.code))
              got=set()
            for p in perms:
              print("PERM_"+p+"="+("YES" if p in got else "NO"))
          PY

          echo "=== CLOUD BUILD TRIGGERS ==="
          gcloud --impersonate-service-account="$DEPLOY_SA" builds triggers list \
            --project=rar-project-5a27e \
            --format='csv[no-heading](id,name,filename,serviceAccount)' || true

          echo "=== SERVICE IMAGE ==="
          gcloud --impersonate-service-account="$DEPLOY_SA" run services describe rar-builder-runtime \
            --project=rar-project-5a27e --region=asia-northeast1 \
            --format='value(spec.template.spec.containers[0].image)'
          echo "RESULT=PASS_DEPLOY_PATH_DIAGNOSTIC"
