name: RAR Silk 2026 Baseline Snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-silk2026-baseline-snapshot.yml"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture immutable Silk 2026 baseline
        run: |
          set -euo pipefail
          mkdir -p audit
          curl -fsS --retry 5 --retry-delay 2             "https://rar-project-5a27e.web.app/v1/consumer-data/dataset/2026%3Asilk"             -o /tmp/live.json

          python - <<'PY'
          import json
          from pathlib import Path

          EXPECTED_VERSION="977cd338fa5585bb2c9332af45eb0683627ce140323a4d1412d509d00e850e3b"
          src=json.loads(Path("/tmp/live.json").read_text(encoding="utf-8"))
          assert src["dataset_key"]=="2026:silk"
          assert src["version_id"]==EXPECTED_VERSION
          rows=src.get("records") or []
          assert int(src["record_count"])==82 and len(rows)==82
          ranks=sorted(int(r["officialRank"]) for r in rows)
          assert ranks==list(range(1,83))

          out={
            "snapshot_type":"RAR_SILK_2026_OBJECTIVE_V1_BASELINE",
            "dataset_key":"2026:silk",
            "version_id":src["version_id"],
            "payload_sha256":src.get("payload_sha256"),
            "record_count":82,
            "transferred_at":src.get("transferred_at"),
            "records":[
              {
                "rank":int(r["officialRank"]),
                "no":int(r["no"]),
                "name":r.get("name"),
                "total":r.get("total"),
                "potential":r.get("potential"),
                "pedigree":r.get("pedigree"),
                "dream":r.get("dream"),
                "investment":r.get("investment"),
              }
              for r in sorted(rows,key=lambda x:int(x["officialRank"]))
            ],
          }
          Path("audit/silk-2026-objective-v1-baseline-20260921.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print("BASELINE_VERSION="+out["version_id"])
          print("BASELINE_COUNT=82")
          print("RESULT=PASS_SILK2026_BASELINE_SNAPSHOT")
          PY

      - name: Commit snapshot and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/rar-silk2026-baseline-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/silk-2026-objective-v1-baseline-20260921.json .github/workflows/rar-silk2026-baseline-snapshot.yml
          git commit -m "audit: freeze Silk 2026 Objective v1 baseline ranking"
          git push
