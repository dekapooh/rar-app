name: RAR Objective v1 2026 Live Verify

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-objective-v1-2026-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify public 2026 dataset adoption
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 "https://rar-project-5a27e.web.app/v1/consumer-data/dataset/2026%3Asilk" -o /tmp/2026.json
          curl -fsS --retry 5 --retry-delay 2 "https://rar-project-5a27e.web.app/v1/consumer-data/current" -o /tmp/current.json
          curl -fsS --retry 5 --retry-delay 2 "https://rar-project-5a27e.web.app/v1/consumer-data/datasets" -o /tmp/catalog.json
          python - <<'PY'
          import json
          EXPECTED="977cd338fa5585bb2c9332af45eb0683627ce140323a4d1412d509d00e850e3b"
          d=json.load(open("/tmp/2026.json",encoding="utf-8"))
          c=json.load(open("/tmp/current.json",encoding="utf-8"))
          cat=json.load(open("/tmp/catalog.json",encoding="utf-8"))
          assert d["dataset_key"]=="2026:silk"
          assert d["version_id"]==EXPECTED
          assert int(d["record_count"])==82 and len(d["records"])==82
          assert c["dataset_key"]=="2026:silk" and c["version_id"]==EXPECTED and int(c["record_count"])==82
          by_no={int(r["no"]):r for r in d["records"]}
          assert set(by_no)==set(range(1,83))
          assert int(by_no[44]["officialRank"])==1
          assert int(by_no[80]["officialRank"])==2
          assert int(by_no[59]["officialRank"])==3
          assert abs(float(by_no[59]["total"])-61.047975)<1e-9
          entries=cat.get("datasets") or []
          by_key={x.get("dataset_key"):x for x in entries}
          assert "2025:silk" in by_key and int(by_key["2025:silk"].get("record_count") or 0)==82
          assert "2026:silk" in by_key
          assert by_key["2026:silk"].get("version_id")==EXPECTED
          assert int(by_key["2026:silk"].get("record_count") or 0)==82
          print("LIVE_DATASET_2026_SILK=PASS_82")
          print("LIVE_CURRENT_2026_SILK=PASS_82")
          print("LIVE_DATASET_CATALOG_2025_2026=PASS")
          print("LIVE_VERSION_ID="+EXPECTED)
          print("RESULT=PASS_LIVE_RAR_2026_OBJECTIVE_ADOPTION")
          PY

      - name: Verify public RAR app dataset loader
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 "https://dekapooh.github.io/rar-app/" -o /tmp/index.html
          curl -fsS --retry 5 --retry-delay 2 "https://dekapooh.github.io/rar-app/system-master-sync.js?v=dataset-selectors-20260918" -o /tmp/sync.js
          grep -Fq "system-master-sync.js" /tmp/index.html
          grep -Fq "2026:silk" /tmp/sync.js
          grep -Fq "DATASET_API_BASE" /tmp/sync.js
          grep -Fq "available_datasets" /tmp/sync.js
          echo "LIVE_APP_DATASET_SELECTOR=PASS"
