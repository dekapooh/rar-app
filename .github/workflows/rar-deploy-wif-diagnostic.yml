name: RAR Deploy WIF Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-deploy-wif-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate deploy identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rar-project-5a27e
          workload_identity_provider: projects/574526681741/locations/global/workloadIdentityPools/github/providers/rar-github
          service_account: rar-github-deploy@rar-project-5a27e.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read-only deploy identity check
        run: |
          echo "ACTIVE_ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          gcloud run services describe rar-builder-runtime \
            --project=rar-project-5a27e \
            --region=asia-northeast1 \
            --format='value(status.latestReadyRevisionName,spec.template.spec.timeoutSeconds)'
          echo "WIF_DEPLOY_IDENTITY=PASS"
