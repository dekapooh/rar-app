name: RAR Deploy OIDC Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-deploy-oidc-probe.yml"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate deploy identity
        uses: google-github-actions/auth@v3
        with:
          project_id: rar-project-5a27e
          workload_identity_provider: projects/574526681741/locations/global/workloadIdentityPools/github/providers/rar-github
          service_account: rar-github-deploy@rar-project-5a27e.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read runtime state
        run: |
          set -euo pipefail
          gcloud run services describe rar-builder-runtime \
            --project=rar-project-5a27e --region=asia-northeast1 \
            --format='value(status.latestReadyRevisionName,status.url)'
          gcloud builds triggers list --project=rar-project-5a27e \
            --format='table(id,name,filename)' || true
