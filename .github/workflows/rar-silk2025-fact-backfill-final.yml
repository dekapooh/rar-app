name: RAR Silk 2025 FACT Backfill And Final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-silk2025-fact-backfill-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill-final:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare Firebase Admin credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-firebase-service-account.json

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet firebase-admin google-cloud-firestore requests

      - name: Backfill FACT without Heavy and finish Silk 2025
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/rar-firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: rar-project-5a27e
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from urllib.parse import quote

          import firebase_admin
          from firebase_admin import auth, credentials, firestore
          import requests

          PROJECT="rar-project-5a27e"
          DATASET="2025:silk"
          DIRECT="https://rar-builder-runtime-gddodhkfiq-an.a.run.app"

          driver=Path(".github/workflows/rar-silk2025-server-e2e-driver.yml").read_text()
          m=re.search(r'API_KEY="([^"]+)"',driver)
          if not m:
              raise SystemExit("Firebase web API key source not found")
          api_key=m.group(1)

          cred=credentials.Certificate("/tmp/rar-firebase-service-account.json")
          firebase_admin.initialize_app(cred, {"projectId":PROJECT})
          db=firestore.client()

          active={
              "READY_FOR_OWNER","OWNER_CLAIMED","PREPROCESSING","ANALYSIS_RUNNING",
              "ANALYSIS_PARTIAL","ANALYSIS_COMPLETE","CROSSCHECK_PENDING",
              "MANAGER_QA_PENDING","QA_PASS","TRANSFER_READY",
          }
          rows=[]
          for snap in db.collection("builderSubmissions").where("dataset_key","==",DATASET).stream():
              d=snap.to_dict() or {}
              if str(d.get("source_mode") or "")!="OFFICIAL_URL_IMPORT":
                  continue
              if str(d.get("status") or "") not in active:
                  continue
              if d.get("pdf_deleted_at"):
                  continue
              rows.append((str(d.get("updated_at") or ""),snap.id,d))
          if not rows:
              raise SystemExit("No active official 2025:silk submission")
          rows.sort()
          _,sid,sub=rows[-1]
          owner_uid=str(sub.get("claimed_by") or "").strip()
          run_id=str(sub.get("run_id") or "").strip()
          if not owner_uid or not run_id:
              raise SystemExit("Owner/run binding missing")

          run_snap=db.collection("builderPotentialRuns").document(run_id).get()
          if not run_snap.exists:
              raise SystemExit("Potential run missing")
          run=run_snap.to_dict() or {}
          if int(run.get("processed") or 0)!=82 or int(run.get("passed") or 0)!=82:
              raise SystemExit("Potential is not 82/82")
          if str(run.get("crosscheck_status") or "")!="PASS":
              raise SystemExit("Crosscheck is not PASS")

          custom=auth.create_custom_token(owner_uid).decode("utf-8")
          ex=requests.post(
              "https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken",
              params={"key":api_key},
              json={"token":custom,"returnSecureToken":True},
              timeout=30,
          )
          ex.raise_for_status()
          token=ex.json()["idToken"]
          s=requests.Session()
          s.headers.update({"Authorization":"Bearer "+token})

          def get_json(resp,label):
              try:
                  data=resp.json() if resp.text else {}
              except Exception:
                  raise RuntimeError(f"{label}: HTTP {resp.status_code} non-JSON")
              if not resp.ok:
                  raise RuntimeError(f"{label}: HTTP {resp.status_code}: {data.get('detail') or data}")
              return data

          cap=get_json(s.get(DIRECT+"/v1/runtime/capabilities",timeout=30),"capabilities")
          print("DIRECT_RUNTIME="+str(cap.get("runtime_version") or "PASS"))
          print("POTENTIAL_EXISTING=82/82")
          print("HEAVY_RERUN=NO")

          ranges=[(1,10),(11,20),(21,30),(31,40),(41,50),(51,60),(61,70),(71,80),(81,82)]
          for start,end in ranges:
              files={
                  "batch_start":(None,str(start)),
                  "batch_end":(None,str(end)),
                  "submission_id":(None,sid),
              }
              resp=s.post(DIRECT+"/v1/potential/batch/start",files=files,stream=True,timeout=(30,300))
              if not resp.ok:
                  raise RuntimeError(f"FACT backfill {start}-{end}: HTTP {resp.status_code}: {resp.text[:500]}")
              ready=None
              for raw in resp.iter_lines(decode_unicode=True):
                  if not raw:
                      continue
                  ev=json.loads(raw)
                  et=ev.get("event")
                  if et in {"batch_error","batch_review"}:
                      raise RuntimeError(f"FACT backfill {start}-{end}: {ev}")
                  if et=="batch_ready":
                      ready=ev
              if not ready:
                  raise RuntimeError(f"FACT backfill {start}-{end}: batch_ready missing")
              if str(ready.get("run_id") or "")!=run_id:
                  raise RuntimeError(f"FACT backfill {start}-{end}: run_id changed")
              pending=[int(x) for x in (ready.get("pending") or [])]
              if pending:
                  raise RuntimeError(f"FACT backfill {start}-{end}: unexpected Heavy pending={pending}")
              print(f"FACT_BACKFILL={start}-{end}|PASS|HEAVY=NO")

          missing=[]
          for no in range(1,83):
              snap=db.collection("builderPotentialRuns").document(run_id).collection("potential").document(str(no)).get()
              d=snap.to_dict() or {}
              if not isinstance(d.get("catalog_fact"),dict):
                  missing.append(no)
          if missing:
              raise RuntimeError("FACT still missing: "+",".join(map(str,missing)))
          print("CATALOG_FACT=82/82")

          final=get_json(
              s.post(
                  DIRECT+"/v1/final-score/build",
                  files={"submission_id":(None,sid),"run_id":(None,run_id)},
                  timeout=(30,900),
              ),
              "final-score",
          )
          if final.get("status")!="FROZEN_FINAL" or int(final.get("record_count") or 0)!=82:
              raise RuntimeError("Final scoring did not reach FROZEN_FINAL 82")
          payload=final.get("payload")
          if not isinstance(payload,dict) or len(payload.get("records") or [])!=82:
              raise RuntimeError("Final payload invalid")
          print("FINAL_SCORE=FROZEN_FINAL_82")

          dry=get_json(
              s.post(DIRECT+"/v1/consumer-transfer/frozen-v2/validate",json=payload,timeout=180),
              "transfer-validate",
          )
          if dry.get("status")!="PASS_DRY_RUN":
              raise RuntimeError("Transfer dry-run failed")
          print("TRANSFER_DRY_RUN=PASS")

          commit=get_json(
              s.post(
                  DIRECT+"/v1/consumer-transfer/frozen-v2/commit",
                  json={"payload":payload,"dry_run":dry},
                  timeout=240,
              ),
              "transfer-commit",
          )
          if commit.get("status")!="PASS_TRANSFER" or not commit.get("version_id"):
              raise RuntimeError("Transfer commit failed")
          print("TRANSFER_COMMIT=PASS")

          current=get_json(
              s.get(DIRECT+"/v1/consumer-data/dataset/"+quote(DATASET,safe=""),timeout=120),
              "consumer-adoption",
          )
          if (
              str(current.get("dataset_key") or "")!=DATASET
              or int(current.get("record_count") or 0)!=82
              or str(current.get("version_id") or "")!=str(commit.get("version_id") or "")
              or str(current.get("source_submission_id") or "")!=sid
          ):
              raise RuntimeError("Consumer adoption verification failed")
          print("CONSUMER_ADOPTION=PASS_82")

          done=get_json(
              s.post(
                  DIRECT+"/v1/submissions/"+quote(sid,safe="")+"/complete-transfer",
                  json={
                      "version_id":commit.get("version_id"),
                      "payload_sha256":commit.get("payload_sha256"),
                      "consumer_records_sha256":commit.get("consumer_records_sha256"),
                  },
                  timeout=180,
              ),
              "complete-transfer",
          )
          if done.get("status")!="RAR_TRANSFERRED" or done.get("pdf_deleted") is not True:
              raise RuntimeError("R2 cleanup confirmation failed")
          print("R2_PDF_DELETE=PASS")
          print("RESULT=PASS_SILK_2025_FACT_BACKFILL_FINAL")
          PY
