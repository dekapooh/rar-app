name: RAR Live Silk 2025 E2E Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-live-silk2025-e2e-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-firebase-service-account.json
      - name: Install Firestore client
        run: python -m pip install --disable-pip-version-check --quiet google-cloud-firestore
      - name: Audit latest 2025 Silk execution state
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/rar-firebase-service-account.json
          GOOGLE_CLOUD_PROJECT: rar-project-5a27e
        run: |
          python - <<'PY'
          from google.cloud import firestore

          db=firestore.Client(project="rar-project-5a27e")
          subs=[]
          for s in db.collection("builderSubmissions").where("dataset_key","==","2025:silk").stream():
              d=s.to_dict() or {}
              subs.append((str(d.get("created_at") or d.get("submitted_at") or d.get("updated_at") or ""), s.id, d))
          assert subs, "NO_2025_SILK_SUBMISSION"
          subs.sort()
          ts,sid,sub=subs[-1]
          run_id=str(sub.get("run_id") or "")
          processed=int(sub.get("processed") or 0)
          print("LATEST_SUBMISSION_ID="+sid)
          print("LATEST_SUBMISSION_STATUS="+str(sub.get("status") or ""))
          print("LATEST_SUBMISSION_PROCESSED="+str(processed))
          print("LATEST_SUBMISSION_SOURCE_MODE="+str(sub.get("source_mode") or ""))
          print("LATEST_SUBMISSION_DATASET="+str(sub.get("dataset_key") or ""))
          print("LATEST_SUBMISSION_HAS_R2="+str(bool((sub.get("r2") or {}).get("catalog_object_key") and (sub.get("r2") or {}).get("measurement_object_key"))))
          print("LATEST_SUBMISSION_RUN_ID="+(run_id or "NONE"))

          runs=[]
          for r in db.collection("builderPotentialRuns").where("dataset_key","==","2025:silk").stream():
              d=r.to_dict() or {}
              runs.append((str(d.get("updated_at") or ""), r.id, d))
          print("POTENTIAL_RUN_COUNT="+str(len(runs)))
          if runs:
              runs.sort()
              rts,rid,run=runs[-1]
              print("LATEST_RUN_ID="+rid)
              print("LATEST_RUN_STATUS="+str(run.get("status") or ""))
              print("LATEST_RUN_PROCESSED="+str(int(run.get("processed") or 0)))
              print("LATEST_RUN_PASSED="+str(int(run.get("passed") or 0)))
              print("LATEST_RUN_SUBMISSION_MATCH="+str(str(run.get("submission_id") or "")==sid))
          else:
              print("LATEST_RUN_ID=NONE")

          final=db.collection("builderFinalRuns").document(sid).get()
          print("FINAL_RUN_EXISTS="+str(final.exists))
          if final.exists:
              fd=final.to_dict() or {}
              print("FINAL_RUN_STATUS="+str(fd.get("status") or ""))
              print("FINAL_RUN_HORSE_COUNT="+str(fd.get("horse_count") or ""))
          PY
