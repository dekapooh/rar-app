name: RAR GCP Deploy Path Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-gcp-deploy-path-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/setup-gcloud@v2
      - name: Authenticate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-gcp.json
          gcloud auth activate-service-account --key-file=/tmp/rar-gcp.json --quiet
          gcloud config set project rar-project-5a27e --quiet

      - name: Inspect available deploy paths
        run: |
          set -euo pipefail
          echo "=== ACTIVE ACCOUNT ==="
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          echo "=== CLOUD BUILD TRIGGERS ==="
          gcloud builds triggers list --project=rar-project-5a27e --format='csv[no-heading](id,name,filename,github.owner,github.name,github.push.branch,serviceAccount)' || true
          echo "=== PROJECT IAM PERMISSIONS ==="
          TOKEN="$(gcloud auth print-access-token)"
          python - <<'PY'
          import json, subprocess
          token=subprocess.check_output(["gcloud","auth","print-access-token"],text=True).strip()
          import urllib.request
          req=urllib.request.Request(
              "https://cloudresourcemanager.googleapis.com/v1/projects/rar-project-5a27e:testIamPermissions",
              data=json.dumps({"permissions":[
                  "cloudbuild.builds.create",
                  "cloudbuild.builds.get",
                  "cloudbuild.triggers.get",
                  "cloudbuild.triggers.list",
                  "cloudbuild.triggers.run",
                  "run.services.get",
                  "run.services.update",
                  "iam.serviceAccounts.actAs"
              ]}).encode(),
              headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req,timeout=30) as r:
              got=set(json.load(r).get("permissions",[]))
          for p in [
              "cloudbuild.builds.create","cloudbuild.builds.get","cloudbuild.triggers.get",
              "cloudbuild.triggers.list","cloudbuild.triggers.run","run.services.get",
              "run.services.update","iam.serviceAccounts.actAs"
          ]:
              print(p+"="+("YES" if p in got else "NO"))
          PY
