name: RAR Live Runtime Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-live-runtime-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prepare credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-gcp.json
          gcloud auth activate-service-account --key-file=/tmp/rar-gcp.json --quiet
          gcloud config set project rar-project-5a27e --quiet
      - name: Inspect runtime services and recent HTTP activity
        run: |
          set -euo pipefail
          echo "=== SERVICES ==="
          for svc in rar-builder-runtime rar-potential-runtime; do
            echo "SERVICE=$svc"
            gcloud run services describe "$svc" --region=asia-northeast1 --project=rar-project-5a27e \
              --format='value(status.latestReadyRevisionName,status.conditions[0].status,status.url)' || true
          done
          echo "=== BUILDER RECENT POTENTIAL HTTP ==="
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="rar-builder-runtime" AND httpRequest.requestUrl:"/v1/potential/"' \
            --project=rar-project-5a27e --freshness=20m --limit=50 --order=desc \
            --format='csv[no-heading](timestamp,httpRequest.requestMethod,httpRequest.status,httpRequest.latency,httpRequest.requestUrl)' || true
          echo "=== HEAVY RECENT HTTP ==="
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="rar-potential-runtime"' \
            --project=rar-project-5a27e --freshness=20m --limit=50 --order=desc \
            --format='csv[no-heading](timestamp,httpRequest.requestMethod,httpRequest.status,httpRequest.latency,httpRequest.requestUrl)' || true
          echo "=== BUILDER ERROR LOGS ==="
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="rar-builder-runtime" AND severity>=ERROR' \
            --project=rar-project-5a27e --freshness=20m --limit=30 --order=desc \
            --format='value(timestamp,severity,textPayload)' || true
          echo "=== HEAVY ERROR LOGS ==="
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="rar-potential-runtime" AND severity>=ERROR' \
            --project=rar-project-5a27e --freshness=20m --limit=30 --order=desc \
            --format='value(timestamp,severity,textPayload)' || true
