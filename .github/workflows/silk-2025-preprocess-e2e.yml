name: Silk 2025 Preprocessing E2E Probe

on:
  push:
    branches:
      - r2-temp-pdf-prodflow
    paths:
      - '.github/workflows/silk-2025-preprocess-e2e.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'PyMuPDF==1.26.7'
      - name: Fetch official sources
        run: |
          curl --fail --location --retry 3 \
            'https://www.silkhorseclub.jp/assets_static/pdf/silkhorseclub_2025_yearlings.pdf' \
            -o /tmp/catalog.pdf
          curl --fail --location --retry 3 \
            'https://www2.silkhorseclub.jp/wp/wp-content/uploads/2025/07/scale_list_2025_boshu.pdf' \
            -o /tmp/measure.pdf
      - name: Run preprocessing probe No.1-10
        run: |
          python - <<'PY'
          import fitz,re,hashlib,json

          def norm(v):
              return re.sub(r'\s+','',str(v or '')).replace('･','・').replace('○外','外')

          # Catalog: detect exactly 82 detail pages by content.
          cdoc=fitz.open('/tmp/catalog.pdf')
          detail=[]
          for i in range(cdoc.page_count):
              page=cdoc[i]
              text=page.get_text('text') or ''
              ls=[x.strip() for x in text.splitlines() if x.strip()]
              joined='\n'.join(ls)
              names=[x for x in ls if re.search(r'の24$',x)]
              centers=[x for x in ls if x in ('美浦入厩','栗東入厩')]
              trainers=[x for x in ls if x.endswith('厩舎予定')]
              births=[x for x in ls if re.fullmatch(r'24\.\d{1,2}\.\d{1,2}生',x)]
              text_ok=len(names)==1 and len(centers)==1 and len(trainers)==1 and len(births)==1 and '総口数' in joined and '一口価格' in joined
              raster_ok=False
              best=None
              if text_ok:
                  seen=set()
                  for image in page.get_images(full=True):
                      xref=int(image[0])
                      if xref in seen: continue
                      seen.add(xref)
                      meta=cdoc.extract_image(xref)
                      w=int(meta.get('width') or 0);h=int(meta.get('height') or 0)
                      if w>h and w>=1000 and h>=700:
                          raster_ok=True
                          area=w*h
                          if best is None or (area,w,h,-xref)>(best[0],best[1],best[2],-best[3]):
                              best=(area,w,h,xref,meta['image'])
              if text_ok and raster_ok:
                  detail.append((i+1,names[0],best))
          assert len(detail)==82, len(detail)

          # Measurements: table geometry.
          mdoc=fitz.open('/tmp/measure.pdf')
          rows={}
          expected_header=["No.","募集馬","性別","生月日\n(2024年)","一口価格","預託予定廐舎","体高","胸囲","管囲","体重"]
          for pi,(lo,hi) in enumerate(((1,43),(44,82))):
              tabs=mdoc[pi].find_tables()
              assert len(tabs.tables)==1, len(tabs.tables)
              data=tabs.tables[0].extract()
              assert data[0]==expected_header, data[0]
              assert len(data)==(hi-lo+1)+1, len(data)
              for row in data[1:]:
                  no=int(str(row[0]).strip())
                  rows[no]=row

          assert sorted(rows)==list(range(1,83))
          print('DETAIL_PAGE_COUNT=82')
          print('MEASUREMENT_ROW_COUNT=82')

          seen_hash=set()
          for no in range(1,11):
              page_no,catalog_name,best=detail[no-1]
              row=rows[no]
              measurement_name=str(row[1]).strip()
              assert norm(catalog_name)==norm(measurement_name),(no,catalog_name,measurement_name)
              h=float(row[6]);g=float(row[7]);cn=float(row[8]);wt=int(row[9])
              assert 130<=h<=180 and 140<=g<=210 and 15<=cn<=25 and 250<=wt<=650
              data=best[4]
              sha=hashlib.sha256(data).hexdigest()
              assert sha not in seen_hash,(no,'duplicate image')
              seen_hash.add(sha)
              print(json.dumps({
                  'no':no,'page':page_no,'name':measurement_name,
                  'height':h,'girth':g,'cannon':cn,'weight':wt,
                  'image_w':best[1],'image_h':best[2],'image_sha256':sha[:16]
              },ensure_ascii=False))
          print('SILK_2025_PREPROCESS_NO_1_10=PASS')
          PY
