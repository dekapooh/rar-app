name: RAR100 branch audit

on:
  push:
    branches:
      - main
      - rar100-integration-20260915
      - feature/dataset-selectors-20260918
      - feature/header-dataset-history-suitability-20260922
      - fix/header-selector-mobile-20260922
      - fix/header-two-row-meta-20260922
      - fix/header-final-theme-20260922
      - fix/header-silks-balance-20260922
      - feature/header-club-silks-final-20260922
    paths:
      - ".github/workflows/rar100-branch-audit.yml"
      - "index.html"
      - "system-master-sync.js"
      - "rar100-preview.html"
      - "sw.js"
      - "rar-v2-summaries.json"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static data audit
        run: |
          python - <<'PY'
          import json,re,pathlib,math
          candidates=[pathlib.Path("rar100-preview.html"),pathlib.Path("index.html")]
          target=next((p for p in candidates if p.exists() and "RAR100_30_20_20_30_20260914_R2" in p.read_text(encoding="utf-8")),None)
          assert target, "RAR100 target not found"
          s=target.read_text(encoding="utf-8")
          m=re.search(r"const HORSES=(\[.*?\]);\n",s,re.S)
          assert m, "HORSES not found"
          horses=json.loads(m.group(1))
          assert len(horses)==82
          anchors=[(0,0),(10,1),(20,2),(30,3),(40,4),(50,5),(60,6),(70,7),(80,8),(90,9),(100,10),(120,11),(140,12),(160,13),(180,14),(200,15),(250,16),(300,17),(350,18),(400,19),(450,20),(500,21),(600,22),(700,23),(800,24),(900,25),(1000,26),(1500,27),(2000,28),(2500,29),(3000,30)]
          def iv(x):
              if x<=0:return 0
              if x>=3000:return 30
              for (x0,y0),(x1,y1) in zip(anchors,anchors[1:]):
                  if x<=x1:return y0+(x-x0)*(y1-y0)/(x1-x0)
              return 30
          for h in horses:
              assert h["rarStatus"]=="FROZEN_FINAL"
              total=h["potential"]+h["pedigree"]+h["dream"]+h["ivOfficial"]
              assert abs(total-h["total"])<1e-8, h["no"]
              assert abs((h["dreamMiddle"]+h["dreamHigh"])/2-h["dream"])<1e-8, h["no"]
              roi=h["prizeOfficialYen"]/(h["price"]*10000)*100
              assert abs(roi-h["roiOfficialPct"])<1e-6, h["no"]
              assert abs(iv(h["roiOfficialPct"])-h["ivOfficial"])<1e-8, h["no"]
          assert 'dreamScenarioMiddle' in s and 'dreamScenarioHigh' in s
          assert 'ivScenarioMiddle' in s and 'ivScenarioHigh' in s
          assert 'function renderScenarioSelectors()' in s
          assert 'const fmt1=v=>Number(v).toFixed(1);' in s
          assert 'currentHorse.dream+"/25"' not in s
          assert 'currentHorse.roi+"/25"' not in s
          index_s=pathlib.Path("index.html").read_text(encoding="utf-8")
          assert '<script src="./system-master-sync.js' in index_s, "SYSTEM MASTER sync is not loaded by index.html"
          assert 'standard:{rankLimit:Infinity' in index_s and 'premium:{rankLimit:Infinity' in index_s
          assert 'const DATASET_PERSONAL_KEYS=[' in index_s
          assert 'window.addEventListener("rar:dataset-before-apply"' in index_s
          assert 'window.addEventListener("rar:dataset-apply-failed"' in index_s
          assert 'window.addEventListener("rar:dataset-changed"' in index_s
          assert 'backupSchema:2' in index_s and 'datasetPersonal:' in index_s
          assert 'rankLimit:82' not in index_s
          assert 'HORSES.length===82' not in index_s
          persist=re.search(r'function persistState\(\)\{(.*?)\n\}',index_s,re.S)
          assert persist and 'localStorage.setItem("rarBetaState",JSON.stringify(state))' in persist.group(1)
          assert 'persistState();\n}' not in persist.group(1), "persistState recursion"
          print(f"RAR100 preview audit PASS: {target} 82/82 + index dataset multikey guards")
          PY
      - name: JavaScript syntax audit
        run: |
          python - <<'PY'
          import re,pathlib
          paths=[pathlib.Path("index.html")]
          if pathlib.Path("rar100-preview.html").exists(): paths.append(pathlib.Path("rar100-preview.html"))
          count=0
          for p in paths:
              s=p.read_text(encoding="utf-8")
              blocks=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",s,re.S|re.I)
              assert blocks
              for i,b in enumerate(blocks):
                  pathlib.Path(f"/tmp/rar-script-{count}.js").write_text(b,encoding="utf-8")
                  count+=1
          print(f"extracted {count} script blocks")
          PY
          for f in /tmp/rar-script-*.js; do node --check "$f"; done
      - name: Dataset selector runtime contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("system-master-sync.js").read_text(encoding="utf-8")
          required=[
            "DATASET_API_BASE",
            "rar:dataset-selection-requested",
            "rar:dataset-before-apply",
            "rar:dataset-apply-failed",
            "rar:dataset-changed",
            "window.__RAR_SYSTEM_MASTER__",
            "record_count: data.record_count",
            "dataset_key: data.dataset_key",
            "const API_URL = 'https://rar-project-5a27e.web.app/v1/consumer-data/current'",
            "dataset_key: '2026:silk'",
            "sync failed; static fallback kept",
          ]
          required += [
            "header.classList.add('rar-dataset-header-ready')",
            "rarDatasetUpdateHistory",
            "suitability = r.suitability || {}",
            "distance_min_m",
            "preferred_surfaces",
            "left:16px",
            "width:47%",
            "grid-template-columns:76px minmax(0,1fr)",
            "rar-header-meta-line",
            "font-size:9.4px",
            "var(--rar-header-mid) 82%",
            "const CLUB_THEMES = Object.freeze({",
            "headerLight: '#DDF2F8'",
            "headerLight: '#F9D8DA'",
            "rar-header-silk",
            "ensureHeaderSilk()",
            "circle cx=\"111\" cy=\"134\"",
            "path d=\"M130 82",
            "tokyo_tc: Object.freeze({",
            "rar-dataset-field--year",
            "rar-dataset-field--club",
            "applyClubTheme",
            "ensureVersionBlock",
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f"dataset selector runtime missing: {missing}"
          assert s.index("window.__RAR_SYSTEM_MASTER__ = {") < s.index("for (const fn of ['syncBaseControls'"), "dataset metadata must publish before UI refresh"
          print("Dataset selector runtime contract PASS")
          PY
      - name: SYSTEM MASTER sync syntax audit
        run: node --check system-master-sync.js
      - name: Service worker dataset cache contract
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("sw.js").read_text(encoding="utf-8")
          assert 'rar-rc66-public-beta-v19-final-club-header' in s
          assert 'system-master-sync.js?v=dataset-selectors-20260918' in s
          print("Service worker dataset cache contract PASS")
          PY
      - name: Service worker syntax audit
        run: node --check sw.js
