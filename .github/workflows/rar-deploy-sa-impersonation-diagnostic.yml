name: RAR Deploy SA Impersonation Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-deploy-sa-impersonation-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-gcp.json
          gcloud auth activate-service-account --key-file=/tmp/rar-gcp.json --quiet
          gcloud config set project rar-project-5a27e --quiet
          echo "BASE_ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"

      - name: Test deploy service-account impersonation
        run: |
          set -euo pipefail
          DEPLOY_SA="rar-github-deploy@rar-project-5a27e.iam.gserviceaccount.com"
          TOKEN="$(gcloud auth print-access-token --impersonate-service-account="$DEPLOY_SA")"
          test -n "$TOKEN"
          echo "IMPERSONATION_TOKEN=PASS"
          CLOUDSDK_AUTH_ACCESS_TOKEN="$TOKEN" gcloud run services describe rar-builder-runtime \
            --project=rar-project-5a27e \
            --region=asia-northeast1 \
            --format='value(status.latestReadyRevisionName,spec.template.spec.timeoutSeconds)'
          echo "DEPLOY_SA_CLOUD_RUN_READ=PASS"
