name: Tokyo TC 2026 No21-30 Live Probe

on:
  push:
    branches:
      - audit/tokyo-tc-2026-no21-30-20260921
    paths:
      - '.github/workflows/tokyo-tc-2026-no21-30-live-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install --quiet requests beautifulsoup4 PyMuPDF
      - name: Probe live Tokyo TC No.21-30
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import fitz, requests
          from bs4 import BeautifulSoup

          lineup_url="https://prod.tokyo-tc.com/lineup/2026"
          horses={
            21:("トップライセンスの25","https://www.tokyo-tc.com/api/media/share/horse/PVMmARoTEEohCmmAPADP5FIZIluH1D2dtNP4PDMQ.pdf"),
            22:("ダンシングラグズの25","https://www.tokyo-tc.com/api/media/share/horse/0Pu9iXA7U7bwzVtMJf5k2rFeZNodP3R0mNl6MAhe.pdf"),
            23:("レッドエルザの25","https://www.tokyo-tc.com/api/media/share/horse/UvIGePwGZy2OjBC7qzDPsEHDEvic5L4LGpyFJC75.pdf"),
            24:("アスタウンドメントの25","https://www.tokyo-tc.com/api/media/share/horse/8Dj3fxbtlSFxvZa5cNGWItYAVT1KyG8i3oG8Q7rM.pdf"),
            25:("レッドシャーロットの25","https://www.tokyo-tc.com/api/media/share/horse/rFbXnrGTj7S5TRYA6TOqjZeLz8BI8Ejp5nJhN7uT.pdf"),
            26:("プラヤデシエルタの25","https://www.tokyo-tc.com/api/media/share/horse/gW7nDrEO8iPXfDffoccO73p8wUj2MIUvnjzW2JRu.pdf"),
            27:("ダーヌビウスの25","https://www.tokyo-tc.com/api/media/share/horse/ASn2zoI3zqfNzZqCr3800UJglPWxMhWUetCwX3Sw.pdf"),
            28:("リュズキナの25","https://www.tokyo-tc.com/api/media/share/horse/6BdZnZpDpb4g5ITXyUaH6eHIvhArD5O6wKifCshh.pdf"),
            29:("インデリブルの25","https://www.tokyo-tc.com/api/media/share/horse/TQStI1WQABqjuCnHxn1Q8N54lLx8Er2SsB5VWxqD.pdf"),
            30:("レッドオルガの25","https://www.tokyo-tc.com/api/media/share/horse/JmGhVf7NdV9n4w26uJGnYOaFqQzpWSqLGhPqtX3X.pdf"),
          }

          sess=requests.Session()
          sess.headers.update({"User-Agent":"RAR-Audit/1.0"})
          html=sess.get(lineup_url,timeout=45)
          html.raise_for_status()
          lineup_text=BeautifulSoup(html.text,"html.parser").get_text("\n",strip=True)

          rows=[]
          hashes=[]
          for no,(name,pdf_url) in horses.items():
              pos=lineup_text.find(name)
              if pos<0:
                  raise RuntimeError(f"No.{no} lineup name missing: {name}")
              window=lineup_text[pos:pos+1800]
              measurement_ok=all(label in window for label in ("体重","体高","胸囲","管囲"))
              cancelled=("募集中止" in window[:400]) if no==27 else False

              resp=sess.get(pdf_url,timeout=60)
              resp.raise_for_status()
              data=resp.content
              if not data.startswith(b"%PDF-"):
                  raise RuntimeError(f"No.{no} did not return PDF")
              doc=fitz.open(stream=data,filetype="pdf")
              if doc.page_count!=1:
                  raise RuntimeError(f"No.{no} page_count={doc.page_count}")
              page=doc[0]
              page_text=page.get_text("text") or ""
              dam=name[:-3]
              identity_ok=dam in page_text

              candidates=[]
              seen=set()
              for image in page.get_images(full=True):
                  xref=int(image[0])
                  if xref in seen:
                      continue
                  seen.add(xref)
                  meta=doc.extract_image(xref)
                  w,h=int(meta["width"]),int(meta["height"])
                  blob=meta["image"]
                  if w>h and w>=800 and h>=500:
                      candidates.append((w*h,w,h,-xref,xref,blob))
              if not candidates:
                  raise RuntimeError(f"No.{no} no landscape candidate")
              candidates.sort(reverse=True)
              _,w,h,_,xref,blob=candidates[0]
              digest=hashlib.sha256(blob).hexdigest()
              hashes.append(digest)
              image_ok=w>h and w>=800 and h>=500 and len(blob)>0
              preprocess_pass=measurement_ok and identity_ok and image_ok
              rows.append({
                  "no":no,
                  "name":name,
                  "lineup_measurements_present":measurement_ok,
                  "cancelled":cancelled,
                  "pdf_page_count":1,
                  "pdf_identity_pass":identity_ok,
                  "image_candidate_count":len(candidates),
                  "selected_width":w,
                  "selected_height":h,
                  "selected_xref":xref,
                  "selected_sha256":digest,
                  "preprocess_pass":preprocess_pass,
              })
              doc.close()

          if len(set(hashes))!=10:
              raise RuntimeError("selected horse image hashes are not unique 10/10")
          passed=sum(1 for r in rows if r["preprocess_pass"])
          if passed!=10:
              raise RuntimeError(f"preprocess pass {passed}/10")
          no27=next(r for r in rows if r["no"]==27)
          if not no27["cancelled"]:
              raise RuntimeError("No.27 cancellation marker not preserved")

          out={
              "dataset_key":"2026:tokyo_tc",
              "scope":"No.21-30",
              "source":"Tokyo TC official frozen lineup + individual official catalog PDFs",
              "fact_measurement_presence":"10/10",
              "pdf_identity":"10/10",
              "canonical_horse_image":"10/10",
              "unique_image_hashes":"10/10",
              "potential_preprocess":"10/10",
              "cancelled_no27_preserved":True,
              "result":"PASS_TOKYO_TC_2026_NO21_30_LIVE_PREPROCESS",
              "records":rows,
          }
          Path("audit").mkdir(exist_ok=True)
          Path("audit/tokyo-tc-2026-no21-30-live-preprocess.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(out["result"])
          PY

      - name: Record pass and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/tokyo-tc-2026-no21-30-live-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/tokyo-tc-2026-no21-30-live-preprocess.json .github/workflows/tokyo-tc-2026-no21-30-live-probe.yml
          git commit -m "audit: pass Tokyo TC 2026 No21-30 live preprocess"
          git push
