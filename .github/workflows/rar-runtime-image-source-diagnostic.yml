name: RAR Runtime Image Source Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-runtime-image-source-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/setup-gcloud@v2
      - name: Authenticate base credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-gcp.json
          gcloud auth activate-service-account --key-file=/tmp/rar-gcp.json --quiet
          gcloud config set project rar-project-5a27e --quiet

      - name: Pull live image and locate pedigree identity gate
        run: |
          set -euo pipefail
          SA="574526681741-compute@developer.gserviceaccount.com"
          IMAGE="asia-northeast1-docker.pkg.dev/rar-project-5a27e/rar-builder/rar-builder-runtime:objective-v1-67a7225301eb"
          gcloud auth print-access-token --impersonate-service-account="$SA" \
            | docker login -u oauth2accesstoken --password-stdin https://asia-northeast1-docker.pkg.dev
          docker pull "$IMAGE"
          echo "=== IMAGE INSPECT ==="
          docker inspect "$IMAGE" --format='ENTRYPOINT={{json .Config.Entrypoint}} CMD={{json .Config.Cmd}} WORKDIR={{.Config.WorkingDir}}'
          echo "=== ERROR STRING ==="
          docker run --rm --entrypoint sh "$IMAGE" -lc '
            for d in /app /workspace /srv /opt /usr/src; do
              [ -d "$d" ] || continue
              grep -R -n -F "fresh catalog-bound Pedigree did not pass 82/82" "$d" 2>/dev/null || true
            done
          '
          echo "=== FOREIGN SIRE STRINGS ==="
          docker run --rm --entrypoint sh "$IMAGE" -lc '
            for d in /app /workspace /srv /opt /usr/src; do
              [ -d "$d" ] || continue
              grep -R -n -E "Pinatubo|Frankel|Justify|Mehmas|ピナツボ|フランケル|ジャスティファイ|メーマス" "$d" 2>/dev/null | head -200 || true
            done
          '
          echo "=== PYTHON FILES ==="
          docker run --rm --entrypoint sh "$IMAGE" -lc '
            find /app /workspace /srv /opt /usr/src -maxdepth 4 -type f \( -name "*.py" -o -name "*.json" \) 2>/dev/null | head -300
          '
          echo "RESULT=PASS_RUNTIME_IMAGE_SOURCE_DIAGNOSTIC"
