name: RAR Runtime Image Source Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rar-runtime-image-source-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate base credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-gcp.json
          gcloud auth activate-service-account --key-file=/tmp/rar-gcp.json --quiet
          gcloud config set project rar-project-5a27e --quiet

      - name: Inspect live pedigree gate source
        run: |
          set -euo pipefail
          SA="574526681741-compute@developer.gserviceaccount.com"
          IMAGE="asia-northeast1-docker.pkg.dev/rar-project-5a27e/rar-builder/rar-builder-runtime:objective-v1-67a7225301eb"
          gcloud auth print-access-token --impersonate-service-account="$SA" | docker login -u oauth2accesstoken --password-stdin https://asia-northeast1-docker.pkg.dev
          docker pull "$IMAGE" >/dev/null

          echo "=== REFERENCES ==="
          docker run --rm --entrypoint sh "$IMAGE" -lc 'grep -R -n -E "silk_2025_pedigree_binding|pedigree_binding_v1|catalog.bound|catalog_bound|identity|Pedigree did not pass" /app/builder_runtime /app/builder_app/python 2>/dev/null | head -300 || true'

          echo "=== BINDING MODULE ==="
          docker run --rm --entrypoint sh "$IMAGE" -lc 'sed -n "1,280p" /app/builder_app/python/silk_2025_pedigree_binding.py'

          echo "=== BINDING TEST ==="
          docker run --rm --entrypoint sh "$IMAGE" -lc 'sed -n "1,340p" /app/builder_app/python/test_silk_2025_pedigree_binding.py'

          echo "=== FINAL SCORE REFERENCES ==="
          docker run --rm --entrypoint sh "$IMAGE" -lc 'grep -n -E "final.score|pedigree|catalog.bound|catalog_bound" /app/builder_runtime/app_with_submission.py | tail -200 || true'

          echo "=== TARGET BINDING ROWS ==="
          docker run --rm --entrypoint sh "$IMAGE" -lc 'grep -n -E -A30 -B5 "\"(no|recruitment_number)\"[[:space:]]*:[[:space:]]*(43|80|81|82)" /app/data/confirmed/silk_2025_pedigree_binding_v1.json || true'

          echo "RESULT=PASS_TARGETED_RUNTIME_SOURCE_DIAGNOSTIC"
