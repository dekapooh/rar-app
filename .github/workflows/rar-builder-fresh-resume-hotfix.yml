name: RAR Builder Fresh Resume Hotfix

on:
  push:
    branches: [r2-temp-pdf-prodflow]
    paths:
      - ".github/workflows/rar-builder-fresh-resume-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-audit-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-temp-pdf-prodflow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch Fresh batch resume handling
        env:
          OLD_MAIN: ""
          NEW_MAIN: ""
          OLD_CATCH: "IH1jYXRjaChlcnIpeyQoJ3Njb3JlU3RhdHVzJykuaW5uZXJIVE1MPSc8c3BhbiBjbGFzcz0iaG9sZCI+RVJST1I8L3NwYW4+JztmYWlsKGVycil9ZmluYWxseXtyZWZyZXNoU2NvcmVSZWFkeSgpfQo="
          NEW_CATCH: "IH1jYXRjaChlcnIpeyQoJ3Njb3JlU3RhdHVzJykuaW5uZXJIVE1MPSc8c3BhbiBjbGFzcz0iaG9sZCI+RVJST1I8L3NwYW4+Jzt0cnl7YXdhaXQgcmVzdG9yZUNsZWFuUHJvZ3Jlc3MoKTskKCdzY29yZUNvdW50JykudGV4dENvbnRlbnQ9cG90ZW50aWFsUHJvY2Vzc2VkKycvODLpoK0nfWNhdGNoe31mYWlsKGVycil9ZmluYWxseXtyZWZyZXNoU2NvcmVSZWFkeSgpfQo="
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('rar-beta-release/rar-builder.html')
          s=p.read_text(encoding='utf-8')
          for a,b,label in [
              (os.environ['OLD_MAIN'],os.environ['NEW_MAIN'],'main'),
              (os.environ['OLD_CATCH'],os.environ['NEW_CATCH'],'catch'),
          ]:
              old=base64.b64decode(a).decode('utf-8')
              new=base64.b64decode(b).decode('utf-8')
              if old not in s:
                  if new in s:
                      continue
                  raise SystemExit(label+' anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Audit and JavaScript syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('rar-beta-release/rar-builder.html').read_text(encoding='utf-8')
          required=[
            'batch_ready再接続中',
            '再接続2回でも未取得',
            "h.issue_code!=='HEAVY_EXECUTION_FAILED'",
            'Fresh Potential停止｜',
            'await restoreCleanProgress()',
          ]
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit('missing '+repr(missing))
          m=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          if not m:
              raise SystemExit('module script missing')
          js='\n'.join(line for line in m.group(1).splitlines() if not line.strip().startswith('import'))
          Path('/tmp/rar-beta.js').write_text(js,encoding='utf-8')
          print('Fresh resume/retry audit PASS')
          PY
          node --check /tmp/rar-beta.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rar-beta-release/rar-builder.html
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "fix: resume Fresh batches after transient stream failures"
            git push origin HEAD:r2-temp-pdf-prodflow
          fi
      - name: Verify Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-firebase-service-account.json
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/rar-firebase-service-account.json
        run: |
          firebase deploy --only hosting,firestore:rules --project rar-project-5a27e --config rar-beta-release/firebase.json
