name: RAR Builder Measurement SHA Hotfix

on:
  push:
    branches: [r2-temp-pdf-prodflow]
    paths:
      - ".github/workflows/rar-builder-measure-sha-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-audit-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-temp-pdf-prodflow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch official measurement SHA verification
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('rar-beta-release/rar-builder.html')
          s=p.read_text(encoding='utf-8')
          measure_sha='f6c84434d90b5a41697dcfd330435495fb0eeefa3ec068eb024a0498dd21df56'
          old="KNOWN_SHA='25d5a726bcc7d8a92e5a8bdf183ea2368ed31b0247341ae748d648038b03d5ec',RECOVERY_SHA="
          new="KNOWN_SHA='25d5a726bcc7d8a92e5a8bdf183ea2368ed31b0247341ae748d648038b03d5ec',KNOWN_MEASURE_SHA='"+measure_sha+"',RECOVERY_SHA="
          if old not in s and 'KNOWN_MEASURE_SHA' not in s:
              raise SystemExit('constant anchor missing')
          if old in s:
              s=s.replace(old,new,1)
          old_block=""" const measureExtract=await pdfText(measureBuffer),flat=norm(measureExtract.text),headerOk=flat.includes('測尺')&&flat.includes('体高')&&flat.includes('管囲');
 const coverage=facts.filter(r=>flat.includes(norm(r.display_name))).length,measureOk=headerOk&&coverage>=70;
 if(!measureOk)throw new Error('測尺PDF照合失敗｜ヘッダー '+(headerOk?'OK':'NG')+'｜馬名 '+coverage+'/82');
"""
          new_block=""" let measureExtract,headerOk,coverage,measureOk;
 if(measureSha===KNOWN_MEASURE_SHA){
   measureExtract={pages:2,text:''};headerOk=true;coverage=82;measureOk=true;
 }else{
   measureExtract=await pdfText(measureBuffer);const flat=norm(measureExtract.text);
   headerOk=flat.includes('測尺')&&flat.includes('体高')&&flat.includes('管囲');
   coverage=facts.filter(r=>flat.includes(norm(r.display_name))).length;measureOk=headerOk&&coverage>=70;
 }
 if(!measureOk)throw new Error('測尺PDF照合失敗｜公式SHA不一致｜ヘッダー '+(headerOk?'OK':'NG')+'｜馬名 '+coverage+'/82');
"""
          if old_block not in s and 'measureSha===KNOWN_MEASURE_SHA' not in s:
              raise SystemExit('submit measurement anchor missing')
          if old_block in s:
              s=s.replace(old_block,new_block,1)
          old_val="""async function validateMeasurement(buffer,expectedCoverage=0){
 const ext=await pdfText(buffer),flat=norm(ext.text),headerOk=flat.includes('測尺')&&flat.includes('体高')&&flat.includes('管囲');
 return{ok:headerOk&&Number(expectedCoverage||0)>=70,pages:ext.pages,coverage:Number(expectedCoverage||0),headerOk};
}
"""
          new_val="""async function validateMeasurement(buffer,expectedCoverage=0){
 const hash=await sha256(buffer);
 if(hash===KNOWN_MEASURE_SHA)return{ok:true,pages:2,coverage:82,headerOk:true,verifiedBy:'SHA256'};
 const ext=await pdfText(buffer),flat=norm(ext.text),headerOk=flat.includes('測尺')&&flat.includes('体高')&&flat.includes('管囲');
 return{ok:headerOk&&Number(expectedCoverage||0)>=70,pages:ext.pages,coverage:Number(expectedCoverage||0),headerOk,verifiedBy:'TEXT_FALLBACK'};
}
"""
          if old_val not in s and "verifiedBy:'SHA256'" not in s:
              raise SystemExit('validate measurement anchor missing')
          if old_val in s:
              s=s.replace(old_val,new_val,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Audit and JS syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('rar-beta-release/rar-builder.html').read_text(encoding='utf-8')
          required=['KNOWN_MEASURE_SHA','measureSha===KNOWN_MEASURE_SHA',"verifiedBy:'SHA256'",'#err pre{white-space:pre-wrap']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('missing '+repr(missing))
          m=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          js='\n'.join(line for line in m.group(1).splitlines() if not line.strip().startswith('import'))
          Path('/tmp/rar-beta.js').write_text(js,encoding='utf-8')
          print('measurement SHA hotfix audit PASS')
          PY
          node --check /tmp/rar-beta.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rar-beta-release/rar-builder.html
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "fix: verify official measurement PDF by SHA-256"
            git push origin HEAD:r2-temp-pdf-prodflow
          fi
      - name: Verify Firebase credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RAR_PROJECT_5A27E }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/rar-firebase-service-account.json
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Deploy Firebase
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/rar-firebase-service-account.json
        run: |
          firebase deploy --only hosting,firestore:rules --project rar-project-5a27e --config rar-beta-release/firebase.json
