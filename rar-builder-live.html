<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RAR Builder Live</title><style>body{font-family:system-ui;background:#101214;color:#f5f5f5;margin:0;padding:20px}.wrap{max-width:760px;margin:auto}.card{background:#1b1e21;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}.ok{color:#7ee787}.warn{color:#f2cc60}.bad{color:#ff7b72}.muted{color:#aaa}.hidden{display:none}button,label{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:#ff8a00;color:#111;font-weight:700;display:inline-block}pre{white-space:pre-wrap;word-break:break-all;font-size:12px}</style></head><body><main class="wrap"><h1>RAR Builder</h1><p class="muted">Silk 2026｜HOLD-safe live E2E</p><section id="loginCard" class="card"><button id="login">Googleでログイン</button></section><section id="authCard" class="card hidden"><div id="who"></div><p id="authState"></p><label for="pdf">公式募集カタログPDFを選ぶ</label><input id="pdf" class="hidden" type="file" accept="application/pdf,.pdf"></section><section id="qa" class="card hidden"><h2>QA</h2><div id="qaText"></div></section><section id="sendCard" class="card hidden"><h2>Managerへ送信</h2><p class="warn">Career TransitionはHOLD。Dream / IV / Forecast / 総合100点は生成しません。</p><button id="send">Managerへ送信</button><button id="retry" class="hidden">同じsubmission_idで再送</button><pre id="receipt"></pre></section><section id="err" class="card hidden"><h2>エラー</h2><pre id="errText"></pre></section></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import{getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{doc,getDoc,getFirestore}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import*as pdfjsLib from'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';
const $=id=>document.getElementById(id),KNOWN='25d5a726bcc7d8a92e5a8bdf183ea2368ed31b0247341ae748d648038b03d5ec',ENDPOINT='https://script.google.com/macros/s/AKfycbyHBDhLl6SfbhH5QaRiyppLlTbVjA8sAJrTYlU1WMEXNjwiuBojY1PG_bmksBFCe1DPPg/exec';let user=null,payload=null;
function fail(e){$('errText').textContent=e?.message||String(e);$('err').classList.remove('hidden')}async function cfg(){const t=await(await fetch('./rar-builder.html',{cache:'no-store'})).text();const g=k=>{const m=t.match(new RegExp(k+":'([^']+)'"));if(!m)throw new Error('Firebase config '+k+' missing');return m[1]};return{apiKey:g('apiKey'),authDomain:g('authDomain'),projectId:g('projectId'),storageBucket:g('storageBucket'),messagingSenderId:g('messagingSenderId'),appId:g('appId')}}async function hash(b){const h=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}function unpack(m){return m.records.map(a=>Object.fromEntries(m.fields.map((f,i)=>[f,a[i]])))}function canon(v){if(Array.isArray(v))return v.map(canon);if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v).sort())o[k]=canon(v[k]);return o}return v}async function htext(s){return hash(new TextEncoder().encode(s))}
const app=initializeApp(await cfg()),auth=getAuth(app),db=getFirestore(app);$('login').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);onAuthStateChanged(auth,async u=>{user=u;if(!u)return;try{let ok=false,role='';const a=await getDoc(doc(db,'adminUsers',u.uid));if(a.exists()&&a.data()?.status==='ACTIVE'){ok=true;role='OWNER'}if(!ok){const z=await getDoc(doc(db,'builderAuthorizations',u.uid));if(z.exists()&&z.data()?.status==='APPROVED'){ok=true;role='BUILDER'}}if(!ok)throw new Error('Builder利用権限がありません');$('loginCard').classList.add('hidden');$('authCard').classList.remove('hidden');$('who').textContent=(u.displayName||u.email||u.uid)+'｜'+role;$('authState').innerHTML='<span class="ok">RAR Builder認証済み</span>'}catch(e){fail(e)}});
$('pdf').onchange=async e=>{try{const f=e.target.files?.[0];if(!f)return;const b=await f.arrayBuffer(),sha=await hash(b),pdf=await pdfjsLib.getDocument({data:new Uint8Array(b)}).promise;if(sha!==KNOWN||pdf.numPages!==128)throw new Error('Silk 2026固定PDFと一致しません');const [fr,pr,dr]=await Promise.all([fetch('./silk_2026_facts_v1.json?v=1'),fetch('./silk_2026_potential_beta49_recovered_v1.json?v=1'),fetch('./silk_2026_pedigree_v1.json?v=1')]);const fm=await fr.json(),pm=await pr.json(),dm=await dr.json();if(fm.records.length!==82||pm.records.length!==82||dm.records.length!==82||dm.qa?.pass!==82)throw new Error('Manifest QA失敗');const facts=unpack(fm),pot=unpack(pm),ped=unpack(dm),ev=[];for(let i=0;i<82;i++){const no=i+1,d=ped[i],p=pot[i];const core={rar_version:'RAR-2026-current',horse_id:'SILK2026_'+String(no).padStart(3,'0'),potential:Number(p.Potential_30_Beta48),pedigree:Number(d.pedigree_20),stability:null,physical_risk:null,behavior_concern:null,maturity:null,transition_release_state:'HOLD',source_provenance:{source_catalog_sha256:sha,potential_route:String(p.Beta49_route_candidate),pedigree_status:String(d.status)}};ev.push({...core,evidence_hash:await htext(JSON.stringify(canon(core)))})}const submittedAt=new Date().toISOString(),sid='silk2026-'+sha.slice(0,16)+'-'+submittedAt.replace(/[-:.TZ]/g,'').slice(0,14);payload={submission_id:sid,supersedes_submission_id:null,rar_user_id:user.uid,contributor_ref:user.displayName||user.email||null,builder_version:'RAR Builder Web v0.3 Career-HOLD',schema_version:'collection-submission-v2',submitted_at:submittedAt,club:'Silk Horse Club',recruitment_year:2026,transition_release_state:'HOLD',source:{source_type:'OFFICIAL_CATALOG_PDF',source_sha256:sha,source_name:f.name,source_url:null,provenance_status:'PASS',parser_profile:'silk-2026-sha-locked',parser_version:'1'},horses:ev.map((r,i)=>({horse_id:r.horse_id,record_id:r.horse_id+':'+r.evidence_hash.slice(0,16),recruitment_number:i+1,display_name:ped[i].display_name,workflow_status:'CAREER_HOLD',facts:facts[i],evaluation:{potential:{status:'CONFIRMED',spec_version:'RAR Potential Ver.4.4 Beta / CLPP Beta4.9',subitems:{scale_frame:pot[i].ScaleFrame_6,rear:pot[i].Rear_10,trunk:pot[i].Trunk_8,front:pot[i].Front_6},total:r.potential},pedigree:{status:'CONFIRMED',spec_version:'Pedigree /20 FROZEN 2026-09-07',subitems:{mother:ped[i].mother_score,sibling:ped[i].sibling_score,sibling_winup:ped[i].sibling_winup_score,nicks:ped[i].nicks_score},total:r.pedigree}},career_evidence:r,career_summary:null,qa:{status:'PASS',fact:'AUTO_PASS',potential:'PASS',pedigree:'PASS',career:'HOLD'},source_page_refs:[],notes:null}))};$('qa').classList.remove('hidden');$('qaText').innerHTML='<span class="ok">PDF PASS｜FACT 82/82｜Potential 82/82｜Pedigree 82/82｜Career Evidence 82/82 READY</span><br><span class="warn">Transition HOLD</span>';$('sendCard').classList.remove('hidden')}catch(e){fail(e)}};
async function submit(){try{if(!user||!payload)throw new Error('Payload未準備');const token=await user.getIdToken(true),res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({submission_id:payload.submission_id,rar_user_id:user.uid,club:payload.club,recruitment_year:payload.recruitment_year,builder_version:payload.builder_version,submitted_at:payload.submitted_at,firebase_id_token:token,canonical_payload:payload}),redirect:'follow'}),text=await res.text();let r;try{r=JSON.parse(text)}catch{throw new Error('Gateway応答JSON失敗 HTTP '+res.status)}if(!r.ok||r.submission_id!==payload.submission_id)throw new Error(r.error||'Receipt不一致');$('receipt').textContent=JSON.stringify(r,null,2);$('retry').classList.remove('hidden')}catch(e){fail(e)}}$('send').onclick=submit;$('retry').onclick=submit;
</script></body></html>
